name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (security review finding, M4 Workstream 7): none of this
# workflow's jobs write to the repo, comment on PRs, or otherwise need more
# than read access — checkout, running tests/lint/benchmarks, and uploading
# to codecov.io (no token; codecov-action doesn't need repo write access to
# do that) all only need contents: read. security.yml already scopes itself
# the same way, for the same reason.
permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the griffe-diff step below can resolve the PR's
          # base ref (KI-020) — same reason commitlint's checkout does this.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Format check
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy --strict src conformance/conftest.py

      - name: Dependency rule check
        run: uv run lint-imports

      - name: Docstring coverage
        run: uv run interrogate src/ontolith -c pyproject.toml

      - name: Public API surface diff (KI-020)
        if: matrix.python-version == '3.12'
        # Blocking as of the 1.0 tag (Implementation Plan §5's "warn pre-1.0,
        # block post-1.0"). This is NOT a required status check in the repo's
        # branch ruleset (checked directly: only deletion, non_fast_forward,
        # pull_request, code_quality, and code_scanning rules exist — no
        # required_status_checks rule) — "blocking" here means a visible red
        # CI failure a reviewer sees and must knowingly merge past, the same
        # as any other job in this workflow, not a structural merge block.
        #
        # A pure addition exits 0 (confirmed: added a new `__all__` export,
        # ran `griffe check` against HEAD). But this does NOT mean it exits 1
        # only for a genuine breaking change — an earlier version of this
        # comment claimed that, and it's wrong: griffe's breakage detector
        # (`find_breaking_changes`) also flags a public attribute's value
        # TEXT changing even when the value is semantically identical
        # (confirmed: reordering `frozenset({"entity", "assertion"})` to
        # `frozenset({"assertion", "entity"})` in store/base.py — same set,
        # exit 1, "Attribute value was changed"), and a signature change on
        # ANY non-underscore module-level function, including ones this
        # project's own ADR-0019 doesn't consider part of the public surface
        # at all (confirmed: adding a required parameter to
        # plugins/sandbox/wire.py's restricted_loads, an internal helper —
        # exit 1). Removing something from `__all__` alone, with the import
        # kept, does NOT trip it (confirmed: exit 0) — `test_public_api_
        # surface.py`'s own pinned `_EXPECTED` dict is what catches that
        # case, not this step. Expect this gate to occasionally flag a
        # cosmetic or internal-only change as a false positive; that's a
        # known, accepted cost of blocking it, not a bug in this workflow.
        # Compares against the PR's base commit; on a push-to-main run (no
        # PR context) compares against HEAD itself, i.e. a no-op — the
        # meaningful comparison already happened during the PR's own run.
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: uv run python -m griffe check ontolith -s src -a "$BASE_REF" -f github

  commitlint:
    name: Commit message format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits format
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|chore|perf|ci)(\([a-zA-Z0-9_-]+\))?: .+'
          failed=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Commit $sha does not follow Conventional Commits: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE_SHA..$HEAD_SHA")
          exit $failed

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install libseccomp (Linux only — ADR-0051 plugin sandbox enforcement)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libseccomp2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests + conformance (combined coverage)
        env:
          HYPOTHESIS_PROFILE: ci
        # Folded scalar (`>-`), not a `\`-continued literal block: this step
        # runs on windows-latest too, whose default shell is PowerShell, which
        # doesn't treat a trailing backslash as a line continuation and fails
        # to parse the command (`Missing expression after unary operator
        # '--'`). A folded scalar collapses to one line, valid in every shell.
        run: >-
          uv run pytest tests/ conformance/
          --cov=src/ontolith --cov-report=xml --cov-report=term
          --cov-fail-under=90

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Run quickstart example
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python examples/quickstart.py

  benchmarks:
    # M4 Workstream 1 exit gate: the 5 SPEC §9 budget rows are enforced as
    # hard per-test ceilings inside tests/benchmarks/ itself (see
    # tests/benchmarks/conftest.py's assert_within_budget) — this job is
    # blocking (no continue-on-error, runs on every PR, not just pushes to
    # main) precisely because those assertions, not this job definition,
    # are what fails a genuine regression.
    name: Benchmarks (§9 budgets)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run benchmarks
        run: uv run pytest tests/benchmarks/ --benchmark-only --benchmark-json=benchmark-results.json -q

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          overwrite: true
