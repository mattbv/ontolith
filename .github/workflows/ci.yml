name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the griffe-diff step below can resolve the PR's
          # base ref (KI-020) — same reason commitlint's checkout does this.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Format check
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy --strict src conformance/conftest.py

      - name: Dependency rule check
        run: uv run lint-imports

      - name: Docstring coverage
        run: uv run interrogate src/ontolith -c pyproject.toml

      - name: Public API surface diff (informational, KI-020)
        if: matrix.python-version == '3.12'
        # warn-only pre-1.0 (Implementation Plan §5): `griffe check` exits 1
        # on any detected change, including non-breaking ones (verified —
        # do not remove continue-on-error without re-verifying this).
        # continue-on-error is what actually makes this informational;
        # blocking post-1.0 is a one-line removal of that flag, not a
        # deeper redesign. Compares against the PR's base commit; on a
        # push-to-main run (no PR context) compares against HEAD itself,
        # i.e. a no-op — the meaningful comparison already happened during
        # the PR's own run.
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: uv run python -m griffe check ontolith -s src -a "$BASE_REF" -f github

  commitlint:
    name: Commit message format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits format
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|chore|perf|ci)(\([a-zA-Z0-9_-]+\))?: .+'
          failed=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Commit $sha does not follow Conventional Commits: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE_SHA..$HEAD_SHA")
          exit $failed

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install libseccomp (Linux only — ADR-0051 plugin sandbox enforcement)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libseccomp2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests + conformance (combined coverage)
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          uv run pytest tests/ conformance/ \
            --cov=src/ontolith --cov-report=xml --cov-report=term \
            --cov-fail-under=90

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Run quickstart example
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python examples/quickstart.py

  benchmarks:
    name: Benchmarks (baseline, informational)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run benchmarks
        run: uv run pytest tests/benchmarks/ --benchmark-only --benchmark-json=benchmark-results.json -q

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
