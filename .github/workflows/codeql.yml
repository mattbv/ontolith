name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of PR activity — re-analyzes already-merged code
    # against CodeQL query updates (same rationale as security.yml's cron).
    - cron: "0 7 * * 1"

# Least privilege: `security-events: write` is what uploading results to
# code scanning requires; everything else stays read-only.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    # The `main` branch ruleset's `code_scanning` rule waits on a CodeQL
    # result for the PR head; without an analysis being uploaded, every PR
    # sits at "Waiting for Code Scanning results" (ADR-0026 Update).
    name: CodeQL (python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # Interpreted language: no build step needed.
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
