name: Feature request
description: Suggest a change or addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Ontolith does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to see. If it touches conflict handling, bitemporal behavior, or governance, say how it fits the specification.
    validations:
      required: true
